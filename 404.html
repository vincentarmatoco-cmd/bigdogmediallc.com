<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Big Dog Media</title>
  <meta name="robots" content="noindex">
  <!-- Styles are inlined on purpose: GitHub Pages serves 404.html from ANY
       missing path, so relative asset links would break at nested URLs. -->
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #0A0A0B;
      color: #F4F1E8;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(4rem, 18vw, 12rem);
      line-height: 0.9;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 2px #C8FF3E;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    p { margin-top: 1.2rem; color: #8A8A82; font-size: 1.05rem; }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 2.2rem;
      border-radius: 999px;
      background: #C8FF3E;
      color: #0A0A0B;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page ran off the leash. Let's get you back to the pack.</p>
    <a href="./">Back to Big Dog</a>
  </main>
</body>
</html>
