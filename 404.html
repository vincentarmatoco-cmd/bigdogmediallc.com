<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Big Dog Media</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <!-- Styles are inlined on purpose: GitHub Pages serves 404.html from ANY
       missing path, so relative asset links (css/, js/) would break at nested
       URLs. Kept on-brand: ink / bone / gold, Archivo display type. -->
  <style>
    :root { --ink:#0A0A0A; --bone:#F4F1EA; --gold:#CF9A4A; --stone:#8F8B83; }
    * { margin: 0; box-sizing: border-box; }
    ::selection { background: var(--gold); color: var(--ink); }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--bone);
      font-family: 'Archivo', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    main { display: flex; flex-direction: column; align-items: center; }
    .eyebrow {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin-top: 1.4rem;
      font-size: clamp(5.5rem, 22vw, 15rem);
      line-height: 0.82;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    p {
      margin-top: 1.4rem;
      max-width: 34ch;
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.15rem, 2.4vw, 1.6rem);
      line-height: 1.3;
      color: var(--stone);
    }
    a {
      display: inline-block;
      margin-top: 2.4rem;
      padding: 15px 26px;
      border-radius: 6px;
      background: var(--bone);
      color: var(--ink);
      text-decoration: none;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.82rem;
      transition: transform 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    a:hover { transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Off the leash</h1>
    <p>This page ran off the leash. Let's get you back to the pack.</p>
    <a href="/">Back to Big Dog</a>
  </main>
</body>
</html>
